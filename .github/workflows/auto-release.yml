name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      new_version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check
        run: |
          current=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          previous=$(git show HEAD~1:pyproject.toml 2>/dev/null | grep '^version' | head -1 | sed 's/.*"\(.*\)".*/\1/' || echo "")

          echo "current=$current previous=$previous"
          if [ "$current" != "$previous" ] && [ -n "$current" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$current" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  create-tag:
    name: Create Release Tag
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag does not already exist
        run: |
          version="v${{ needs.check-version.outputs.new_version }}"
          if git ls-remote --tags origin "$version" | grep -q .; then
            echo "::error::Tag $version already exists"
            exit 1
          fi

      - name: Create and push tag
        run: |
          version="v${{ needs.check-version.outputs.new_version }}"
          git tag "$version"
          git push origin "$version"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
