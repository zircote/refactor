name: Rollback Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to rollback to (e.g., v2.1.0)"
        required: true
        type: string
      reason:
        description: "Reason for rollback"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate Rollback Target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Validate tag exists
        run: |
          if ! git tag -l "${{ inputs.version }}" | grep -q .; then
            echo "::error::Tag ${{ inputs.version }} does not exist"
            exit 1
          fi

  verify:
    name: Verify Rollback Target
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen --extra dev 2>/dev/null || pip install pytest pytest-cov

      - name: Run tests at rollback target
        run: |
          if command -v uv &> /dev/null && [ -f uv.lock ]; then
            uv run pytest --tb=short -q
          else
            python -m pytest --tb=short -q
          fi

  rollback:
    name: Rollback to ${{ inputs.version }}
    needs: [validate, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Get current latest release
        id: current
        run: |
          latest=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "none")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute rollback
        run: |
          rollback_tag="${{ inputs.version }}"
          rollback_version="${rollback_tag#v}"
          current="${{ steps.current.outputs.latest }}"

          cat > rollback_notes.md << 'NOTES'
          ## Rollback Release

          | Field | Value |
          |-------|-------|
          | **Rolled back from** | CURRENT_PLACEHOLDER |
          | **Rolled back to** | TAG_PLACEHOLDER |
          | **Reason** | REASON_PLACEHOLDER |
          | **Triggered by** | ACTOR_PLACEHOLDER |
          | **Verified** | Tests passed at rollback target |
          NOTES

          sed -i "s|CURRENT_PLACEHOLDER|${current}|g" rollback_notes.md
          sed -i "s|TAG_PLACEHOLDER|${rollback_tag}|g" rollback_notes.md
          sed -i "s|REASON_PLACEHOLDER|${{ inputs.reason }}|g" rollback_notes.md
          sed -i "s|ACTOR_PLACEHOLDER|${{ github.actor }}|g" rollback_notes.md

          # Mark current release as superseded
          if [ "$current" != "none" ]; then
            gh release edit "$current" \
              --notes "$(gh release view "$current" --json body -q .body)

          ---
          **Superseded by rollback to ${rollback_tag}** — ${{ inputs.reason }}" || true
          fi

          # Promote rollback version as latest
          gh release edit "$rollback_tag" --latest \
            --notes "$(cat rollback_notes.md)" || \
          gh release create "$rollback_tag" \
            --title "v${rollback_version} (rollback)" \
            --notes-file rollback_notes.md \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
