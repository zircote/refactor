<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="ig-bg-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#16213E"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" rx="12" fill="url(#ig-bg-d)" stroke="#2D3748" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="48" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#E2E8F0" text-anchor="middle">Refactor Plugin</text>
  <text x="400" y="72" font-family="system-ui, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Swarm-orchestrated code refactoring for Claude Code</text>

  <!-- Divider -->
  <line x1="60" y1="90" x2="740" y2="90" stroke="#2D3748" stroke-width="1"/>

  <!-- Phase flow -->
  <rect x="60" y="110" width="160" height="80" rx="8" fill="#1E293B" stroke="#FF8C42" stroke-width="2"/>
  <text x="140" y="136" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#FF8C42" text-anchor="middle">Phase 1</text>
  <text x="140" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E0" text-anchor="middle">Foundation</text>
  <text x="140" y="172" font-family="system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">PARALLEL</text>

  <path d="M225,150 L260,150" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-d)"/>
  <defs><marker id="arrow-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#475569"/></marker></defs>

  <rect x="265" y="110" width="200" height="80" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
  <text x="365" y="136" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#A78BFA" text-anchor="middle">Phase 2</text>
  <text x="365" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E0" text-anchor="middle">Iteration Loop (x3)</text>
  <text x="365" y="172" font-family="system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">SEQUENTIAL</text>

  <path d="M470,150 L505,150" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-d)"/>

  <rect x="510" y="110" width="160" height="80" rx="8" fill="#1E293B" stroke="#4ECDC4" stroke-width="2"/>
  <text x="590" y="136" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#4ECDC4" text-anchor="middle">Phase 3-4</text>
  <text x="590" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E0" text-anchor="middle">Assessment + Report</text>
  <text x="590" y="172" font-family="system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">PARALLEL</text>

  <!-- Divider -->
  <line x1="60" y1="210" x2="740" y2="210" stroke="#2D3748" stroke-width="1"/>

  <text x="400" y="240" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#94A3B8" text-anchor="middle" letter-spacing="2">FIVE SPECIALIST AGENTS</text>

  <!-- Agent 1: Architect -->
  <rect x="60" y="260" width="128" height="100" rx="8" fill="#1E293B" stroke="#FF8C42" stroke-width="1.5"/>
  <circle cx="86" cy="285" r="10" fill="#FF8C42" opacity="0.15"/>
  <text x="86" y="289" font-family="system-ui, sans-serif" font-size="12" fill="#FF8C42" text-anchor="middle" font-weight="bold">A</text>
  <text x="136" y="289" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0" text-anchor="middle">Architect</text>
  <text x="124" y="310" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Reviews architecture</text>
  <text x="124" y="324" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Plans optimizations</text>
  <text x="124" y="338" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Scores quality (1-10)</text>

  <!-- Agent 2: Test -->
  <rect x="198" y="260" width="128" height="100" rx="8" fill="#1E293B" stroke="#4ECDC4" stroke-width="1.5"/>
  <circle cx="224" cy="285" r="10" fill="#4ECDC4" opacity="0.15"/>
  <text x="224" y="289" font-family="system-ui, sans-serif" font-size="12" fill="#4ECDC4" text-anchor="middle" font-weight="bold">T</text>
  <text x="274" y="289" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0" text-anchor="middle">Test</text>
  <text x="262" y="310" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Analyzes coverage</text>
  <text x="262" y="324" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Generates test cases</text>
  <text x="262" y="338" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Verifies all passing</text>

  <!-- Agent 3: Code -->
  <rect x="336" y="260" width="128" height="100" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
  <circle cx="362" cy="285" r="10" fill="#8B5CF6" opacity="0.15"/>
  <text x="362" y="289" font-family="system-ui, sans-serif" font-size="12" fill="#A78BFA" text-anchor="middle" font-weight="bold">C</text>
  <text x="412" y="289" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0" text-anchor="middle">Code</text>
  <text x="400" y="310" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Implements changes</text>
  <text x="400" y="324" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Clean code principles</text>
  <text x="400" y="338" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Fixes test failures</text>

  <!-- Agent 4: Simplifier -->
  <rect x="474" y="260" width="128" height="100" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="500" cy="285" r="10" fill="#F59E0B" opacity="0.15"/>
  <text x="500" y="289" font-family="system-ui, sans-serif" font-size="12" fill="#FBBF24" text-anchor="middle" font-weight="bold">S</text>
  <text x="550" y="289" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0" text-anchor="middle">Simplifier</text>
  <text x="538" y="310" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Naming clarity</text>
  <text x="538" y="324" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Flow simplification</text>
  <text x="538" y="338" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Cross-file consistency</text>

  <!-- Agent 5: Security -->
  <rect x="612" y="260" width="128" height="100" rx="8" fill="#1E293B" stroke="#F87171" stroke-width="1.5"/>
  <circle cx="638" cy="285" r="10" fill="#F87171" opacity="0.15"/>
  <text x="638" y="289" font-family="system-ui, sans-serif" font-size="12" fill="#F87171" text-anchor="middle" font-weight="bold">R</text>
  <text x="690" y="289" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0" text-anchor="middle">Security</text>
  <text x="676" y="310" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Regression detection</text>
  <text x="676" y="324" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Vulnerability scanning</text>
  <text x="676" y="338" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Security scoring</text>

  <!-- Divider -->
  <line x1="60" y1="380" x2="740" y2="380" stroke="#2D3748" stroke-width="1"/>

  <text x="400" y="410" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#94A3B8" text-anchor="middle" letter-spacing="2">KEY FEATURES</text>

  <!-- Feature pills (5) -->
  <rect x="60" y="425" width="120" height="30" rx="15" fill="#FF8C42" opacity="0.08" stroke="#FF8C42" stroke-width="1" opacity="0.5"/>
  <text x="120" y="445" font-family="system-ui, sans-serif" font-size="11" fill="#FF8C42" text-anchor="middle">Safety First</text>

  <rect x="195" y="425" width="120" height="30" rx="15" fill="#4ECDC4" opacity="0.08" stroke="#4ECDC4" stroke-width="1" opacity="0.5"/>
  <text x="255" y="445" font-family="system-ui, sans-serif" font-size="11" fill="#4ECDC4" text-anchor="middle">Auto Test Gen</text>

  <rect x="330" y="425" width="120" height="30" rx="15" fill="#8B5CF6" opacity="0.08" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
  <text x="390" y="445" font-family="system-ui, sans-serif" font-size="11" fill="#A78BFA" text-anchor="middle">Parallel Exec</text>

  <rect x="465" y="425" width="120" height="30" rx="15" fill="#F59E0B" opacity="0.08" stroke="#F59E0B" stroke-width="1" opacity="0.5"/>
  <text x="525" y="445" font-family="system-ui, sans-serif" font-size="11" fill="#FBBF24" text-anchor="middle">Quality Scoring</text>

  <rect x="600" y="425" width="120" height="30" rx="15" fill="#F87171" opacity="0.08" stroke="#F87171" stroke-width="1" opacity="0.5"/>
  <text x="660" y="445" font-family="system-ui, sans-serif" font-size="11" fill="#F87171" text-anchor="middle">Focus Mode</text>

  <!-- Footer -->
  <text x="400" y="495" font-family="'SF Mono', monospace" font-size="12" fill="#475569" text-anchor="middle">v2.2.0  |  All languages  |  Claude Code plugin</text>
</svg>
