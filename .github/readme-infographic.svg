<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="ig-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8F0"/>
      <stop offset="100%" style="stop-color:#FFF0E6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" rx="12" fill="url(#ig-bg)" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="48" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#2D3748" text-anchor="middle">Refactor Plugin</text>
  <text x="400" y="72" font-family="system-ui, sans-serif" font-size="13" fill="#A0AEC0" text-anchor="middle">Swarm-orchestrated code refactoring for Claude Code</text>

  <!-- Divider -->
  <line x1="60" y1="90" x2="740" y2="90" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Phase flow -->
  <!-- Phase 1 -->
  <rect x="60" y="110" width="160" height="80" rx="8" fill="#FFF" stroke="#FF8C42" stroke-width="2"/>
  <text x="140" y="136" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#FF8C42" text-anchor="middle">Phase 1</text>
  <text x="140" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#4A5568" text-anchor="middle">Foundation</text>
  <text x="140" y="172" font-family="system-ui, sans-serif" font-size="10" fill="#A0AEC0" text-anchor="middle">PARALLEL</text>

  <!-- Arrow 1-2 -->
  <path d="M225,150 L260,150" fill="none" stroke="#CBD5E0" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#CBD5E0"/></marker></defs>

  <!-- Phase 2 -->
  <rect x="265" y="110" width="200" height="80" rx="8" fill="#FFF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="365" y="136" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#8B5CF6" text-anchor="middle">Phase 2</text>
  <text x="365" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#4A5568" text-anchor="middle">Iteration Loop (x3)</text>
  <text x="365" y="172" font-family="system-ui, sans-serif" font-size="10" fill="#A0AEC0" text-anchor="middle">SEQUENTIAL</text>

  <!-- Arrow 2-3 -->
  <path d="M470,150 L505,150" fill="none" stroke="#CBD5E0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 3 -->
  <rect x="510" y="110" width="160" height="80" rx="8" fill="#FFF" stroke="#4ECDC4" stroke-width="2"/>
  <text x="590" y="136" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#2EAF9F" text-anchor="middle">Phase 3-4</text>
  <text x="590" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#4A5568" text-anchor="middle">Assessment + Report</text>
  <text x="590" y="172" font-family="system-ui, sans-serif" font-size="10" fill="#A0AEC0" text-anchor="middle">PARALLEL</text>

  <!-- Divider -->
  <line x1="60" y1="210" x2="740" y2="210" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Four Agents section -->
  <text x="400" y="240" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#4A5568" text-anchor="middle" letter-spacing="2">FOUR SPECIALIST AGENTS</text>

  <!-- Agent 1: Architect -->
  <rect x="60" y="260" width="155" height="100" rx="8" fill="#FFF" stroke="#FF8C42" stroke-width="1.5"/>
  <circle cx="90" cy="285" r="10" fill="#FF8C42" opacity="0.2"/>
  <text x="90" y="289" font-family="system-ui, sans-serif" font-size="12" fill="#FF8C42" text-anchor="middle" font-weight="bold">A</text>
  <text x="150" y="289" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2D3748" text-anchor="middle">Architect</text>
  <text x="137" y="310" font-family="system-ui, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Reviews architecture</text>
  <text x="137" y="325" font-family="system-ui, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Plans optimizations</text>
  <text x="137" y="340" font-family="system-ui, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Scores quality (1-10)</text>

  <!-- Agent 2: Test -->
  <rect x="230" y="260" width="155" height="100" rx="8" fill="#FFF" stroke="#4ECDC4" stroke-width="1.5"/>
  <circle cx="260" cy="285" r="10" fill="#4ECDC4" opacity="0.2"/>
  <text x="260" y="289" font-family="system-ui, sans-serif" font-size="12" fill="#2EAF9F" text-anchor="middle" font-weight="bold">T</text>
  <text x="320" y="289" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2D3748" text-anchor="middle">Test</text>
  <text x="307" y="310" font-family="system-ui, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Analyzes coverage</text>
  <text x="307" y="325" font-family="system-ui, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Generates test cases</text>
  <text x="307" y="340" font-family="system-ui, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Verifies all passing</text>

  <!-- Agent 3: Code -->
  <rect x="400" y="260" width="155" height="100" rx="8" fill="#FFF" stroke="#8B5CF6" stroke-width="1.5"/>
  <circle cx="430" cy="285" r="10" fill="#8B5CF6" opacity="0.2"/>
  <text x="430" y="289" font-family="system-ui, sans-serif" font-size="12" fill="#8B5CF6" text-anchor="middle" font-weight="bold">C</text>
  <text x="490" y="289" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2D3748" text-anchor="middle">Code</text>
  <text x="477" y="310" font-family="system-ui, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Implements changes</text>
  <text x="477" y="325" font-family="system-ui, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Clean code principles</text>
  <text x="477" y="340" font-family="system-ui, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Fixes test failures</text>

  <!-- Agent 4: Simplifier -->
  <rect x="570" y="260" width="155" height="100" rx="8" fill="#FFF" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="600" cy="285" r="10" fill="#F59E0B" opacity="0.2"/>
  <text x="600" y="289" font-family="system-ui, sans-serif" font-size="12" fill="#D97706" text-anchor="middle" font-weight="bold">S</text>
  <text x="660" y="289" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2D3748" text-anchor="middle">Simplifier</text>
  <text x="647" y="310" font-family="system-ui, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Naming clarity</text>
  <text x="647" y="325" font-family="system-ui, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Flow simplification</text>
  <text x="647" y="340" font-family="system-ui, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Cross-file consistency</text>

  <!-- Divider -->
  <line x1="60" y1="380" x2="740" y2="380" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Key Features row -->
  <text x="400" y="410" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#4A5568" text-anchor="middle" letter-spacing="2">KEY FEATURES</text>

  <!-- Feature pills -->
  <rect x="60" y="425" width="140" height="30" rx="15" fill="#FF8C42" opacity="0.1" stroke="#FF8C42" stroke-width="1"/>
  <text x="130" y="445" font-family="system-ui, sans-serif" font-size="11" fill="#FF8C42" text-anchor="middle">Safety First</text>

  <rect x="215" y="425" width="140" height="30" rx="15" fill="#4ECDC4" opacity="0.1" stroke="#4ECDC4" stroke-width="1"/>
  <text x="285" y="445" font-family="system-ui, sans-serif" font-size="11" fill="#2EAF9F" text-anchor="middle">Auto Test Gen</text>

  <rect x="370" y="425" width="140" height="30" rx="15" fill="#8B5CF6" opacity="0.1" stroke="#8B5CF6" stroke-width="1"/>
  <text x="440" y="445" font-family="system-ui, sans-serif" font-size="11" fill="#8B5CF6" text-anchor="middle">Parallel Execution</text>

  <rect x="525" y="425" width="140" height="30" rx="15" fill="#F59E0B" opacity="0.1" stroke="#F59E0B" stroke-width="1"/>
  <text x="595" y="445" font-family="system-ui, sans-serif" font-size="11" fill="#D97706" text-anchor="middle">Quality Scoring</text>

  <!-- Footer -->
  <text x="400" y="495" font-family="'SF Mono', monospace" font-size="12" fill="#CBD5E0" text-anchor="middle">v2.1.0  |  All languages  |  Claude Code plugin</text>
</svg>
